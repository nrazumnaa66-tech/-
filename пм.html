    // ==========================================

    let database = [];

    window.onload = function() {
        const saved = localStorage.getItem('testDatabase');
        // Если пользователь менял базу у себя — берём её, иначе берём вшитую в файл
        const activeText = (saved && saved.trim().length > 0) ? saved : EMBEDDED_DATABASE.trim();
        
        document.getElementById('rawText').value = activeText;
        parseDatabase(activeText);
    };

    function toggleDb() {
        const container = document.getElementById('db-container');
        container.style.display = container.style.display === 'none' ? 'block' : 'none';
    }

    function saveDatabase() {
        const text = document.getElementById('rawText').value;
        localStorage.setItem('testDatabase', text);
        parseDatabase(text);
        toggleDb();
        searchQuestions();
    }

    function parseDatabase(text) {
        database = [];
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let currentQ = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            // Распознаёт вопросы с номером (1. / 1)), с ":" или со знаком "?" на конце
            if (/^\d+[\.\)]\s*/.test(line) || line.endsWith(':') || line.endsWith('?')) {
                if (currentQ && currentQ.answer) {
                    database.push(currentQ);
                }
                let cleanQ = line.replace(/^\d+[\.\)]\s*/, '');
                currentQ = { fullQ: line, cleanQ: cleanQ, answer: '' };
            } else if (currentQ && !currentQ.answer) {
                currentQ.answer = line.replace(/^[а-гa-d][\.\)]\s*/i, '');
            }
        }
        if (currentQ && currentQ.answer) {
            database.push(currentQ);
        }
        document.getElementById('counter').innerText = `В базе вопросов: ${database.length}`;
    }

    function searchQuestions() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const startOnly = document.getElementById('startOnly').checked;
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if (!query) {
            document.getElementById('counter').innerText = `В базе вопросов: ${database.length}`;
            return;
        }

        const filtered = database.filter(item => {
            const qText = item.cleanQ.toLowerCase();
            return startOnly ? qText.startsWith(query) : qText.includes(query);
        });

        document.getElementById('counter').innerText = `Найдено: ${filtered.length}`;

        filtered.slice(0, 30).forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="question">${item.fullQ}</div>
                <div class="answer">✓ ${item.answer}</div>
            `;
            resultsDiv.appendChild(card);
        });
    }
</script>
